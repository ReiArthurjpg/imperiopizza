version: '3.8'

services:
  frontend:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/front.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - imperial_network

  backend:
    image: nginx:alpine
    ports:
      - "${API_PORT:-8001}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/back.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - imperial_network

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-imperial_pizza}
      DB_USERNAME: ${DB_USERNAME:-imperial}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - .:/var/www/html
    networks:
      - imperial_network

  db:
    image: mysql:8.0
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-imperial_pizza}
      MYSQL_USER: ${DB_USERNAME:-imperial}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - imperial_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    depends_on:
      - db
    networks:
      - imperial_network

volumes:
  db_data:

networks:
  imperial_network:
    driver: bridge
