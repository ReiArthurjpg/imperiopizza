name: Deploy de PROD para Hostinger

on:
  push:
    branches:
      - prod

  workflow_dispatch:

jobs:
  deploy:
    name: Build e Deploy para Hostinger
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      # ============================================================
      # 1. Baixar código
      # ============================================================
      - name: ⬇️ Baixar código do repositório
        uses: actions/checkout@v4

      # ============================================================
      # 2. Configurar PHP
      # ============================================================
      - name: 🐘 Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo, pdo_mysql
          tools: composer:v2
          coverage: none

      # ============================================================
      # 3. Validar Composer
      # ============================================================
      - name: 🔎 Validar composer.json
        run: composer validate --no-check-publish

      # ============================================================
      # 4. Instalar dependências PHP
      # ============================================================
      - name: 📦 Instalar dependências PHP
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      # ============================================================
      # 5. Configurar Node.js
      # ============================================================
      - name: 🟢 Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # ============================================================
      # 6. Instalar dependências Node
      # ============================================================
      - name: 📦 Instalar dependências Node
        run: npm ci

      # ============================================================
      # 7. Compilar Tailwind / Frontend
      # ============================================================
      - name: 🛠️ Compilar Tailwind CSS
        run: npm run build

      # ============================================================
      # 8. Limpar arquivos que não devem ir para a produção
      # ============================================================
      - name: 🧹 Limpar arquivos indesejados
        run: |
          rm -rf .git .github node_modules docker docker-compose.yml tailwind.config.js package.json package-lock.json README.md LEIA-ME.txt

      # ============================================================
      # 9. Deploy para Hostinger via SSH (SCP)
      # ============================================================
      - name: 🚀 Deploy para Hostinger via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: ${{ secrets.SSH_TARGET }}